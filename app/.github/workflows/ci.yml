name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for unresolved merge conflicts
        run: |
          if grep -rlE '^(<<<<<<<|=======$|>>>>>>>)' . \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.output; then
            echo "::error::Unresolved merge-conflict markers found in the files above."
            exit 1
          fi

      - name: Typecheck, lint & build
        run: pnpm run validate:production
